# Weekly update PRs for build tools and GitHub Actions. Each one runs CI; merge only when green.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    ignore:
      # Version 6 makes the caching part proprietary (Gradle's terms of use); stay on 5.
      - dependency-name: "gradle/actions"
        versions: [">= 6"]
