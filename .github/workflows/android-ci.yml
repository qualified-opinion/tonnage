name: Android CI

# Runs unit tests and builds an installable debug APK on every push and pull request.
# Download the APK from the run's "Artifacts" section (Actions tab -> pick the run).
on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test release version guards
        run: python3 tools/test-release-version.py

      - name: Run unit tests
        run: ./gradlew test

      - name: Report 20,000-set record guard timings
        run: cat app/build/reports/records-guard.txt

      - name: Run debug lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Compiles the minified (R8) release variant so shrinker problems surface before a release.
      - name: Verify release build
        run: ./gradlew assembleRelease

      # The committed schema must match the entities, so every schema change lands with its JSON
      # (and a migration test). On failure the log prints the generated file to commit.
      - name: Check Room schemas are committed
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::app/schemas differs from the committed files. Commit the generated schema JSON."
            git status --porcelain app/schemas
            git diff app/schemas
            git ls-files --others --exclude-standard app/schemas | while read -r f; do echo "== $f"; cat "$f"; done
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tonnage-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Room writes its schema JSON during the build; keep it so it can be committed for migration tests.
      - name: Upload Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
