name: Android Release

# Builds a release APK.
#   - Push a tag like v1.0.0  -> builds and attaches the APK to a GitHub Release.
#   - Run manually (Actions tab -> Android Release -> Run workflow) with a version such as 1.0.0
#     -> tags the commit v1.0.0 and publishes the GitHub Release with the APK.
#   - Run manually with the version left blank -> APK available as an artifact only.
#
# Signing: add these repository secrets (Settings -> Secrets and variables -> Actions) to sign
# with your own key. Without them the APK is signed with a throwaway debug key (see README).
#   TONNAGE_KEYSTORE_BASE64   base64 of your .jks keystore file
#   TONNAGE_KEYSTORE_PASSWORD keystore password
#   TONNAGE_KEY_ALIAS         key alias
#   TONNAGE_KEY_PASSWORD      key password
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.0.0 (leave blank to just build the APK)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Work out version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          INPUT_VERSION="${INPUT_VERSION#v}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Publish release tags only from commits already merged into main."
              exit 1
            fi
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            # A published release must come from main, or it can ship code that never merged.
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::Publish releases from main. This run is on '${GITHUB_REF_NAME}'; leave the version blank to only build an APK."
              exit 1
            fi
            if ! [[ "$INPUT_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
              echo "::error::Version must look like 1.0.0, got '$INPUT_VERSION'."
              exit 1
            fi
            VERSION_NAME="$INPUT_VERSION"
            echo "TONNAGE_RELEASE_TAG=v${VERSION_NAME}" >> "$GITHUB_ENV"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "TONNAGE_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "TONNAGE_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Decode signing keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.TONNAGE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TONNAGE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TONNAGE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TONNAGE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tonnage-release.jks"
            {
              echo "TONNAGE_KEYSTORE_FILE=$RUNNER_TEMP/tonnage-release.jks"
              echo "TONNAGE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "TONNAGE_KEY_ALIAS=$KEY_ALIAS"
              echo "TONNAGE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the release keystore from repository secrets."
          elif [ -n "${TONNAGE_RELEASE_TAG:-}" ] || [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "::error::TONNAGE_KEYSTORE_BASE64 is not set - a published release must be signed with your own key."
            exit 1
          else
            echo "::warning::TONNAGE_KEYSTORE_BASE64 is not set - the APK will be signed with a temporary debug key and cannot be installed over a differently signed build."
          fi

      - name: Run unit tests
        run: ./gradlew test

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Tonnage-${TONNAGE_VERSION_NAME}.apk"
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tonnage-release-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

      # A manual run with a version creates the tag on the commit it built, then the release.
      - name: Publish GitHub Release (manual run)
        if: env.TONNAGE_RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TONNAGE_RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Tonnage ${{ env.TONNAGE_VERSION_NAME }}
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
